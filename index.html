<title>Mao Rulekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Committed look: a secret society's notebook. Plum and amber in every theme. */
:root{
  color-scheme:dark;
  --bg:#150b1e; --surface:#211330; --surface-2:#2d1c40; --ink:#f5eefb; --muted:#b8a7c8; --line:#3c2a52;
  --amber:#f0a73a; --amber-ink:#22110a; --rose:#ff6b8b; --good:#6fd1a0; --err:#ff8a8a; --err-bg:#3a1826;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:800;color:var(--amber)}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 14px;font-weight:600;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-size:17px;padding:14px;font-weight:800}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err);background:transparent}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.names{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle .tl{font-weight:600}
.toggle .ts{display:block;font-size:13px;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:999px;padding:0;position:relative;background:var(--bg);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--amber);border-color:var(--amber)}
.switch[aria-checked="true"]::after{left:25px;background:var(--amber-ink)}

/* players */
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.pl.lead{border-color:var(--amber);background:linear-gradient(90deg,rgba(240,167,58,.14),transparent)}
.pl .pn{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.pl .meta{font-size:13px;color:var(--muted);grid-column:1}
.pl .wins{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;text-align:right;grid-row:1 / 3;grid-column:2}
.pl .wins small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pen{grid-row:1 / 3;grid-column:3;background:var(--err-bg);color:var(--err);border-color:var(--err);font-weight:800;padding:10px 12px}
.reasons{grid-column:1 / 4;display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.reasons button{font-size:13px;padding:7px 11px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rose);color:#1a0610;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px);text-align:center}

/* secret rules */
.vault{display:flex;flex-direction:column;gap:8px}
.sealed{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--amber)}
.sealed .ic{font-size:22px;grid-row:1 / 3}
.sealed .t{font-weight:800}
.sealed .m{font-size:13px;color:var(--muted);grid-column:2}
.sealed .peek{grid-row:1 / 3;grid-column:3;font-size:13px;padding:8px 10px;touch-action:none}
.sealed.open{border-style:solid;background:var(--surface-2)}
.sealed .reveal{grid-column:2 / 4;font-size:15px;padding-top:6px}
.sealed .reveal b{color:var(--amber)}
.starter{display:flex;flex-direction:column;gap:6px}
.starter div{padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.starter b{color:var(--amber)}

/* hand-off screen */
.handoff{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.handoff .inner{max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px}
.handoff .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;text-align:center;text-wrap:balance}
.handoff .who{color:var(--amber)}
.option{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:linear-gradient(160deg,#f6d08d,#f0a73a);color:var(--amber-ink);text-align:left;border:0}
.option .cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.7}
.option .rt{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:800}
.option .rd{font-size:15px;font-weight:500}
.option[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}


/* deck list */
.rlist{display:flex;flex-direction:column}
.ritem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.star{background:transparent;border:0;font-size:22px;padding:2px 4px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--amber)}
.ritem .t{font-weight:800}
.ritem .d{font-size:14px;color:var(--muted)}
.ritem .c{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);font-weight:800}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
.stwrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
@media (max-width:380px){.hl{grid-template-columns:1fr}}

.banner{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.banner h2{font-size:24px;font-weight:800}
.banner button{background:var(--amber-ink);color:var(--amber);border-color:var(--amber-ink)}

/* guide */
.guide{display:flex;flex-direction:column;gap:14px}
.guide section{display:flex;flex-direction:column;gap:6px}
.guide p,.guide li{font-size:15px;line-height:1.6;max-width:65ch}
.guide p{margin:0}
.guide ul,.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide b{color:var(--amber)}
.callout{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.55}
.script{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14.5px;font-style:italic;line-height:1.6}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "mao-game-v1", PREFS = "mao-prefs-v1";
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#2d1c40"/><rect x="30" y="18" width="40" height="58" rx="7" fill="#f0a73a" transform="rotate(-8 50 47)"/><text x="50" y="63" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="38" fill="#2a1438" transform="rotate(-8 50 47)">?</text><rect x="60" y="64" width="22" height="16" rx="3" fill="#fff"/><path d="M65 64 V59 a6 6 0 0 1 12 0 V64" fill="none" stroke="#fff" stroke-width="3.5"/></svg>`;

// ---------- starter rules ----------
const STARTERS = [
  ["match","Match the card","Play a card that matches the top card's suit or rank. Can't play? Draw one card.", true],
  ["spades","Spades","When you play a spade, say its name out loud: “Seven of spades.”", true],
  ["seven","Have a nice day","When a 7 is played, say “Have a nice day.” Each 7 in a row adds a “very”: “Have a very nice day.”", true],
  ["jack","Jacks are wild","A Jack can be played on anything. Name the new suit when you play it.", true],
  ["eight","8 reverses","An 8 reverses the direction of play.", true],
  ["ace","Aces skip","An Ace skips the next player.", true],
  ["king","All hail","When a King is played, the player says “All hail the Chairman.”", false],
  ["mao","Mao","Say “Mao” when you're down to one card. Win by playing your last card and saying “Mao” again.", true],
  ["thanks","Thank you","Say “Thank you” every time you're handed a penalty card.", true],
  ["talk","No talking","No talking during play except for rule phrases, “Point of order,” and calling penalties.", true],
  ["poo","Point of order","Anyone can call “Point of order” to pause the game. Hold your cards face down, talk freely, then someone calls “End point of order.”", true],
];

// ---------- the rule deck ----------
const CATS = { card:"Card triggers", say:"Say something", do:"Do something", turn:"Turn order", pen:"Penalty rules", wild:"Wild" };
const RULES = [
  // Card triggers
  ["card","Hearts","When a heart is played, say “I love you” to the next player."],
  ["card","Diamonds","When a diamond is played, say “Bling.”"],
  ["card","Clubs","When a club is played, knock twice on the table."],
  ["card","Three's company","When a 3 is played, say “Three's company.”"],
  ["card","Four on the floor","When a 4 is played, everyone taps the floor with one foot."],
  ["card","High five","When a 5 is played, high-five the player on your left."],
  ["card","Six pack","When a 6 is played, flex."],
  ["card","Nein","When a 9 is played, say “Nein.”"],
  ["card","Ten-four","When a 10 is played, say “Ten-four, good buddy.”"],
  ["card","Your Majesty","When a Queen is played, say “Yes, Your Majesty.”"],
  ["card","Salute","Salute whenever a face card is played."],
  ["card","Up top","When an Ace is played, everyone points to the ceiling. Last one draws a card."],
  ["card","Twos","A 2 makes the next player draw 2 cards, unless they play a 2 of their own."],
  ["card","Deja vu","When the same rank is played twice in a row, say “Deja vu.”"],
  ["card","Seeing red","When a red card lands on a red card, say “Seeing red.”"],
  ["card","Blackout","When a black card lands on a black card, say “Lights out.”"],
  ["card","Blackjack","When the top two cards add up to 21, say “Blackjack.” Face cards are 10, Aces are 11."],
  ["card","Straight","Three cards in a row by rank, like 4-5-6? Say “Straight.”"],
  ["card","Lucky 7s","When a 7 of hearts is played, everyone says “Lucky.”"],
  ["card","The Queen of Spades","When the Queen of Spades is played, everyone gasps."],
  ["card","One-eyed Jacks","When a one-eyed Jack (spades or hearts) is played, cover one eye until the next card."],
  ["card","Suicide King","When the King of Hearts is played, the player says “Goodbye, cruel world.”"],
  ["card","Even steven","When an even number lands on an even number, say “Even steven.”"],
  ["card","Odd one out","When an odd number lands on an odd number, say “Odd.”"],
  ["card","Pair up","Playing the same rank as the card below you skips the next player."],
  ["card","Same suit streak","Three of the same suit in a row: everyone says “Flush.”"],
  // Say something
  ["say","Mao Mao","Say “Mao Mao” when you're down to two cards."],
  ["say","Please","Say “Please” every time you draw a card."],
  ["say","Name the suit","Say the suit of every card you play, not just spades."],
  ["say","Countdown","Say how many cards you have left after each play."],
  ["say","Compliment","Pay the next player a compliment every time you play a face card."],
  ["say","Good game","Say “Good game” to the player who just played before you play."],
  ["say","Weather","When the direction reverses, say “The winds have changed.”"],
  ["say","Echo","Repeat the last phrase anyone said before playing."],
  ["say","Sorry","Say “Sorry” when you make someone draw."],
  ["say","Roll call","Say the name of the next player when you play."],
  ["say","Bless you","When anyone draws a card, everyone else says “Bless you.”"],
  ["say","Hello and goodbye","Say “Hello” to your first card of the hand and “Goodbye” to your last."],
  ["say","Knock knock","When a Jack changes the suit, say “Knock knock.” The next player must say “Who's there?”"],
  ["say","Nice day, reversed","After an 8, “Have a nice day” becomes “Have a terrible day.”"],
  ["say","Speak up","When you draw, announce the card count of the player with the fewest cards."],
  ["say","Accent","Every phrase must be said in an accent picked by the rule-maker."],
  ["say","Chairman's name","The winner of the last hand must be called “Chairman” by everyone."],
  ["say","Rhymes","When you say a rule phrase, add a word that rhymes with it."],
  // Do something
  ["do","Forehead","Tap the card to your forehead before playing it."],
  ["do","Off hand","Play cards with your non-dominant hand."],
  ["do","Stand for royalty","Stand up to play a King or Queen."],
  ["do","Double knock","Knock twice before drawing a card."],
  ["do","Clap it out","Clap once whenever the direction reverses."],
  ["do","Nose goes","When a 9 is played, touch your nose. Last one draws a card."],
  ["do","Face down draw","Draw your cards without looking at the table."],
  ["do","Spin","Spin your card once on the table before letting go."],
  ["do","Eye contact","Make eye contact with the next player when you play."],
  ["do","Hands flat","When a 10 is played, everyone puts their hands flat on the table. Last one draws."],
  ["do","Wave","Wave at the player you skip."],
  ["do","Mime","Mime your rule phrases instead of saying them."],
  ["do","Card slap","When a Jack is played, slap the pile. Last one draws."],
  ["do","Thumbs","Hold your cards with only your thumbs visible."],
  ["do","Bow","Bow to the Chairman before playing your last card."],
  ["do","Hat trick","Put your hand on your head when you have 3 cards left."],
  // Turn order
  ["turn","Across the table","A Queen makes the player across from you go next."],
  ["turn","Skip 10","A 10 skips the next player."],
  ["turn","Slap in","If you hold the exact same card as the one just played, you may play it out of turn."],
  ["turn","Seven reverses too","A 7 also reverses direction."],
  ["turn","Double skip","Two Aces in a row skip two players."],
  ["turn","Dealer's choice","A King lets the player choose who goes next."],
  ["turn","Back at you","A 3 sends the turn back to the player who just played."],
  ["turn","Pass the hat","When a 5 is played, everyone passes one card to the left."],
  ["turn","Swap hands","When a Joker or a 6 of hearts is played, that player may swap hands with anyone."],
  ["turn","Two cards","A 4 lets the next player play two cards if they match."],
  // Penalty rules
  ["pen","Laugh tax","Laughing during play costs a card."],
  ["pen","False Mao","Saying “Mao” when you don't have one card left costs a card."],
  ["pen","Phone","Touching your phone costs a card."],
  ["pen","The R-word","Saying the word “rule” costs a card."],
  ["pen","No questions","Asking a question during play costs a card."],
  ["pen","Slow poke","Taking more than 5 seconds on your turn costs a card."],
  ["pen","Wrong name","Calling someone by their real name costs a card. Use nicknames the Chairman assigns."],
  ["pen","Swearing","Swearing costs a card."],
  ["pen","Pointing","Pointing at anyone costs a card."],
  ["pen","Say it right","Mispronouncing a rule phrase costs a card."],
  ["pen","Double thanks","Say “Thank you very much” for penalty cards. Just “Thank you” costs another."],
  ["pen","Overcalled","Calling a penalty that isn't real costs the caller a card."],
  ["pen","Early bird","Picking up your cards before the deal is done costs a card."],
  ["pen","Nervous hands","Fidgeting with the draw pile costs a card."],
  // Wild
  ["wild","No yes","Nobody may say “yes.” Nod instead."],
  ["wild","Hum along","Everyone hums while the dealer shuffles."],
  ["wild","Chairman's seat","The winner of the last hand picks where everyone sits."],
  ["wild","Birthday","If it's anyone's birthday week, they may draw an extra card and discard one."],
  ["wild","Opposite day","Red cards count as black and black as red for matching."],
  ["wild","Time out","Once per hand, any player may say “Time out” and skip their turn with no penalty."],
  ["wild","Good sport","The player with the most cards may ask one question during play without penalty."],
  ["wild","Dance break","When the direction reverses twice in a row, everyone does a quick dance move."],
  ["wild","Villain","When someone plays their second-to-last card, they must laugh like a villain."],
  ["wild","Farewell","When a player wins, everyone else says “Long live the Chairman.”"],
  ["wild","Silent hand","No rule phrases for one hand. Mime them all."],
  ["wild","Lucky draw","If you draw a card you can play right away, you must say “Lucky me.”"],
];
const REASONS = ["Talking","Wrong card","Out of turn","Too slow","Forgot a phrase","Forgot “Mao”","Forgot “thank you”","Broke a secret rule","Other","Wrong guess"];

// ---------- state ----------
let state = load(KEY) || { phase:"setup", count:5, names:Array(12).fill(""), beginner:true, sips:false, starter:Object.fromEntries(STARTERS.map(s=>[s[0], s[3]])), players:[], hands:[], penalties:[], rules:[], tab:"game", revealed:false };
const TITLES = ["Chairman of the Board","Supreme Leader of the Deck","Grand Poobah","Card Czar","Keeper of Secrets","Chief Rule Officer","Emperor of Eights","Duke of Diamonds","Archduke of Aces","Lord of the Draw Pile","Minister of Mischief","Head Honcho","Commissioner of Chaos","Top Banana","Big Cheese","Admiral of Spades"];
if (!state.extras) state.extras = { retire:true, cap:6, guess:true, titles:true };
if (!state.guesses) state.guesses = [];
let prefs = load(PREFS) || { favs:{}, custom:[], mode:"boost", cat:"all", q:"", onlyFav:false };
let guess = null, making = null, penFor = null, toast = null, toastT = null, openPeek = null;
let confirmKey = null, confirmTimer = null;

function load(k){ try{ const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PREFS, JSON.stringify(prefs)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${n===1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0,-1)+"ies" : w+"s"}`;
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const N = i => esc(state.players[i]);
const allRules = () => RULES.map(([c,t,d]) => ({ id:slug(t), c, t, d })).concat(prefs.custom.map(r => ({ ...r, custom:true })));
const handNo = () => state.hands.length + 1;

const activeRules = () => state.rules.map((r,k)=>[r,k]).filter(([r])=>!r.retired);
const chairTitle = () => { const h = state.hands[state.hands.length-1]; return state.extras.titles && h && h.title ? h.title : null; };
function extrasPanel(inGame){
  const x = state.extras;
  return `${inGame?`<details class="panel"><summary style="cursor:pointer;font-weight:800">House extras</summary><div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">`:`<div class="panel"><div class="eyebrow">House extras</div>`}
    <div class="toggle"><span class="tl">Retire old rules<span class="ts">When there are too many secret rules, the oldest is revealed and dropped.</span></span>
      <button class="switch" role="switch" id="sw-retire${inGame?"-g":""}" data-act="xRetire" aria-checked="${x.retire}" aria-label="Retire old rules"></button></div>
    ${x.retire?`<div class="chips" style="margin-top:-4px">${[5,6,8].map(v=>`<button class="chip" id="cap-${v}${inGame?"-g":""}" data-act="xCap" data-v="${v}" aria-pressed="${x.cap===v}">Max ${v}</button>`).join("")}</div>`:""}
    <div class="toggle"><span class="tl">Guess the rule<span class="ts">During a point of order, guess a secret rule. Right: discard a card and the rule is cracked. Wrong: take a penalty card.</span></span>
      <button class="switch" role="switch" id="sw-guess${inGame?"-g":""}" data-act="xGuess" aria-checked="${x.guess}" aria-label="Guess the rule"></button></div>
    <div class="toggle"><span class="tl">Chairman titles<span class="ts">Each hand's winner gets a grand title. Everyone must use it, or take a card.</span></span>
      <button class="switch" role="switch" id="sw-titles${inGame?"-g":""}" data-act="xTitles" aria-checked="${x.titles}" aria-label="Chairman titles"></button></div>
  ${inGame?"</div></details>":"</div>"}`;
}
function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
function showToast(msg){ toast = msg; clearTimeout(toastT); toastT = setTimeout(()=>{ toast = null; render(); }, 2200); }
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

// ---------- drawing rule options ----------
function drawOptions(k){
  let list = allRules();
  if (prefs.cat !== "all") list = list.filter(r => r.c === prefs.cat);
  const used = new Set(state.rules.map(r => r.id));
  list = list.filter(r => !used.has(r.id));
  if (prefs.mode === "favs"){ const f = list.filter(r => prefs.favs[r.id]); if (f.length) list = f; }
  const picks = [];
  const pool = list.map(r => [r, prefs.mode === "boost" && prefs.favs[r.id] ? 4 : 1]);
  while (picks.length < k && pool.length){
    const total = pool.reduce((a,[,w])=>a+w,0); let x = Math.random()*total, idx = 0;
    for (let i = 0; i < pool.length; i++){ x -= pool[i][1]; if (x <= 0){ idx = i; break; } }
    picks.push(pool[idx][0]); pool.splice(idx,1);
  }
  return picks;
}

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const tab = state.phase === "setup" && state.tab === "game" ? "setup" : state.tab;
  app.innerHTML = topBar() + (tab === "setup" ? setupView() : tab === "game" ? gameView() : tab === "deck" ? deckView() : guideView())
    + (making ? handoffView() : "") + (guess ? guessView() : "") + (toast ? `<div class="toast" role="status">${toast}</div>` : "");
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  if (!making) window.scrollTo(0, y);
}
function topBar(){
  return `<div class="top"><div class="brand">${LOGO}<h1>Mao</h1></div>
    <div class="tabs" role="tablist">${[["game","Game"],["deck","Rule deck"],["guide","How to play"]].map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" data-act="tab" data-v="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div></div>`;
}

function setupView(){
  return `<div class="panel">
    <div class="eyebrow">Players</div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer players" ${state.count<=3?"disabled":""}>−</button>
      <span class="count num">${state.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More players" ${state.count>=12?"disabled":""}>+</button>
      <p class="hint grow">3 to 12. 4 to 8 is the sweet spot.</p>
    </div>
    <div class="names">${Array.from({length:state.count},(_,i)=>`<input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(state.names[i]||"")}" maxlength="14" autocomplete="off" aria-label="Player ${i+1}">`).join("")}</div>
  </div>
  <div class="panel">
    <div class="eyebrow">How secret?</div>
    <div class="toggle"><span class="tl">Beginner mode<span class="ts">Everyone can see the starting rules. Only winners' rules stay secret. Best for a first game.</span></span>
      <button class="switch" role="switch" id="sw-beg" data-act="beginner" aria-checked="${state.beginner}" aria-label="Beginner mode"></button></div>
    <div class="toggle"><span class="tl">Drinking variant<span class="ts">Every penalty card also means a sip.</span></span>
      <button class="switch" role="switch" id="sw-sips" data-act="sips" aria-checked="${state.sips}" aria-label="Drinking variant"></button></div>
  </div>
  ${extrasPanel(false)}
  <div class="panel">
    <div class="eyebrow">Starting rules</div>
    <p class="hint">These are in effect from the first card. Turn off any you don't want.</p>
    ${STARTERS.map(([k,t,d])=>`<div class="toggle"><span class="tl">${t}<span class="ts">${d}</span></span><button class="switch" role="switch" id="st-${k}" data-act="starter" data-v="${k}" aria-checked="${!!state.starter[k]}" aria-label="${t}" ${k==="match"?"disabled":""}></button></div>`).join("")}
  </div>
  <button class="primary" data-act="start" id="start">Start the game</button>
  <p class="hint">First time? Read the How to play tab before you deal. It has a script for explaining Mao to friends.</p>`;
}

function gameView(){
  const n = state.hands.length, np = state.players.length;
  const wins = state.players.map((_,i)=> state.hands.filter(h=>h.winner===i).length);
  const pens = state.players.map((_,i)=> state.penalties.filter(p=>p.p===i).length);
  const handPens = state.players.map((_,i)=> state.penalties.filter(p=>p.p===i && p.hand===handNo()).length);
  const maxW = Math.max(...wins);
  const chairman = n ? state.hands[n-1].winner : null;
  const order = state.players.map((_,i)=>i).sort((a,b)=> wins[b]-wins[a] || pens[a]-pens[b] || a-b);

  const players = order.map(i => `<div class="pl ${n && wins[i]===maxW && maxW>0?"lead":""}">
    <span class="pn">${chairman===i?"👑 ":""}${N(i)}${chairman===i&&chairTitle()?`<span style="display:block;font-size:13px;color:var(--amber);font-weight:700">${esc(chairTitle())}</span>`:""}</span>
    <span class="meta num">${plural(pens[i],"penalty")} total${handPens[i]?` · ${handPens[i]} this hand`:""}${state.sips&&pens[i]?` · ${plural(pens[i],"sip")}`:""}</span>
    <span class="wins num">${wins[i]}<small>won</small></span>
    <button class="pen" id="pen-${i}" data-act="penOpen" data-i="${i}" aria-expanded="${penFor===i}">+1</button>
    ${penFor===i?`<div class="reasons">${REASONS.map((r,k)=>`<button id="rs-${i}-${k}" data-act="pen" data-i="${i}" data-v="${k}">${r}</button>`).join("")}</div>`:""}
  </div>`).join("");

  const starters = STARTERS.filter(s => state.starter[s[0]]);
  const starterBox = state.beginner
    ? `<div class="panel"><h2>Starting rules</h2><div class="starter">${starters.map(s=>`<div><b>${s[1]}.</b> ${s[2]}</div>`).join("")}</div></div>`
    : `<div class="panel"><div class="row"><h2 class="grow">Starting rules</h2><span class="hint">${plural(starters.length,"rule")}, secret</span></div>
        <div class="vault">${sealedCard("starters", "🔐", "The starting rules", "Hold to peek. For the dealer only.", starters.map(s=>`<b>${s[1]}.</b> ${s[2]}`).join("<br>"))}</div></div>`;

  const act = activeRules(), retired = state.rules.map((r,k)=>[r,k]).filter(([r])=>r.retired);
  const secretCount = act.filter(([r])=>!r.cracked).length;
  const ruleCard = ([r,k]) => r.cracked
    ? `<div class="sealed open"><span class="ic" aria-hidden="true">🔓</span><span class="t">Rule ${k+1}: ${esc(r.t)}</span><span class="m">Made by ${N(r.by)} · cracked by ${N(r.crackedBy)}</span><div class="reveal">${esc(r.d)}</div></div>`
    : sealedCard("r"+k, "🔒", `Rule ${k+1}`, `Made by ${N(r.by)} after hand ${r.hand}`, `<b>${esc(r.t)}.</b> ${esc(r.d)}`);
  const retiredBanner = state.lastRetired && state.lastRetired.length ? `<div class="callout" style="border-left-color:var(--rose)"><b style="color:var(--rose)">Rule retired!</b> ${state.lastRetired.map(k=>`Rule ${k+1} was <b>${esc(state.rules[k].t)}</b>: ${esc(state.rules[k].d)}`).join(" ")} Read it out loud. It's no longer in effect.
    <div style="margin-top:8px"><button class="small" data-act="dismissRetired" id="dismissRetired">Got it</button></div></div>` : "";
  const vault = `<div class="panel"><div class="row"><h2 class="grow">Secret rules</h2><span class="hint num">${secretCount} secret${act.length-secretCount?` · ${act.length-secretCount} cracked`:""}${state.extras.retire?` · max ${state.extras.cap}`:""}</span></div>
    ${retiredBanner}
    ${act.length ? `<div class="vault">${act.map(ruleCard).join("")}</div>
      <p class="hint">Press and hold to peek, and make sure nobody's looking over your shoulder.</p>` : `<p class="hint">Nothing sealed yet. When someone wins a hand, they make a secret rule.</p>`}
    ${state.extras.guess && act.some(([r])=>!r.cracked) ? `<button data-act="guessStart" id="guessStart">🔍 Someone wants to guess a rule</button>` : ""}
    ${state.rules.length ? `<button data-act="reveal" id="reveal">${state.revealed?"Hide the rules again":confirmKey==="reveal"?"Tap again to reveal everything":"🎉 The big reveal"}</button>` : ""}

  </div>`;

  const win = `<div class="panel"><h2>Hand ${handNo()}: who said Mao?</h2>

      ${state.hands.map((h,k)=>{ const pp = state.penalties.filter(p=>p.hand===k+1).length; return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow"><b>Hand ${k+1}:</b> ${N(h.winner)} won</span><span class="hint num">${plural(pp,"penalty")}${h.rule?" · 🔒 rule made":""}</span></div>`; }).reverse().join("")}
      <button class="small ghost" data-act="undoPen" id="undoPen" ${state.penalties.length?"":"disabled"}>${confirmKey==="undoPen"?"Tap to confirm":"Undo last penalty"}</button></div>`;
  }
  const reset = `<div class="btnrow"><button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button></div>`;
  const chairBanner = chairman != null && chairTitle() ? `<div class="banner" style="padding:14px 16px;gap:4px"><span class="eyebrow" style="color:inherit;opacity:.75">All hail</span><h2 style="font-size:21px">${esc(chairTitle())} ${N(chairman)}</h2><span style="font-size:14px">Address them by their full title until the next hand, or take a card.</span></div>` : "";
  return chairBanner + `<div class="panel" style="gap:10px"><div class="row"><h2 class="grow">Players</h2><span class="hint">Tap +1 to hand out a penalty card</span></div><div class="players">${players}</div></div>`
    + win + vault + starterBox + hist + statsView() + extrasPanel(true) + reset;
}

function statsView(){
  const n = state.hands.length, P = state.penalties; if (!n && !P.length) return "";
  const np = state.players.length, z = () => Array(np).fill(0);
  const wins = z(), pens = z(), secret = z(), made = z(), clean = z();
  const reasonCount = {};
  state.hands.forEach((h,k) => { wins[h.winner]++; if (h.rule) made[h.winner]++; state.players.forEach((_,i)=>{ if (!P.some(p=>p.p===i && p.hand===k+1)) clean[i]++; }); });
  P.forEach(p => { pens[p.p]++; if (p.r === 7) secret[p.p]++; reasonCount[p.r] = (reasonCount[p.r]||0) + 1; });
  let worstHand = {v:0, list:[]};
  for (let k = 1; k <= n; k++) state.players.forEach((_,i)=>{ const c = P.filter(p=>p.p===i && p.hand===k).length; if (c > worstHand.v) worstHand = {v:c, list:[[i,k]]}; else if (c && c === worstHand.v) worstHand.list.push([i,k]); });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const low = arr => { const m = Math.min(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const nm = idx => [...new Set(idx)].map(N).join(", ");
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const w = top(wins), pm = top(pens), sb = top(secret), cl = top(clean), fewest = low(pens);
  const topReason = Object.entries(reasonCount).sort((a,b)=>b[1]-a[1])[0];
  const cracked = z(), wrongG = z(); state.guesses.forEach(g => g.ok ? cracked[g.p]++ : wrongG[g.p]++);
  const cb = top(cracked);
  const cards = [
    aw("Chairman", w.m?nm(w.who):"Nobody yet", w.m?`Won ${plural(w.m,"hand")}`:"No hands won yet"),
    aw("Penalty magnet", pm.m?nm(pm.who):"Nobody yet", pm.m?`${plural(pm.m,"penalty card")}`:"Everyone's been perfect"),
    aw("Squeaky clean", n?nm(cl.who):"–", n?`${plural(cl.m,"hand")} with no penalties`:""),
    aw("Rule breaker", sb.m?nm(sb.who):"Nobody yet", sb.m?`Broke a secret rule ${plural(sb.m,"time")}`:"The secrets are safe so far"),
    aw("Worst hand", worstHand.v?nm(worstHand.list.map(x=>x[0])):"Nobody yet", worstHand.v?`${plural(worstHand.v,"penalty")} in hand ${[...new Set(worstHand.list.map(x=>x[1]))].join(", ")}`:""),
    aw("Most common crime", topReason?REASONS[topReason[0]]:"None yet", topReason?`${plural(topReason[1],"time")} so far`:""),
    ...(state.extras.guess ? [aw("Codebreaker", cb.m?nm(cb.who):"Nobody yet", cb.m?`Cracked ${plural(cb.m,"secret rule")}`:"No rules cracked yet")] : []),
    ...(state.extras.titles && state.hands.some(h=>h.title) ? [aw("Latest title", N(state.hands[n-1].winner), esc(state.hands[n-1].title))] : []),
  ];
  return `<div class="panel"><h2>Stats</h2><div class="hl">${cards.join("")}</div>
    <div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>Won</th><th>Penalties</th><th>Per hand</th><th>Clean</th><th>Rules made</th>${state.extras.guess?"<th>Guesses</th>":""}</tr></thead>
    <tbody>${state.players.map((p,i)=>`<tr><td>${N(i)}</td><td>${wins[i]}</td><td>${pens[i]}</td><td>${(pens[i]/Math.max(1,n + (P.some(x=>x.hand===handNo())?1:0))).toFixed(1)}</td><td>${clean[i]}</td><td>${made[i]}</td>${state.extras.guess?`<td>${cracked[i]}✓ ${wrongG[i]}✗</td>`:""}</tr>`).join("")}</tbody></table></div>
    <p class="hint">Clean counts finished hands with zero penalties. Tag a penalty “Broke a secret rule” to track rule breakers.</p></div>`;
}

function ruleList(){
  const q = prefs.q.trim().toLowerCase();

  if (q) list = list.filter(r => (r.t+" "+r.d).toLowerCase().includes(q));

    ${r.custom?`<button class="small ghost" data-act="delCustom" data-id="${r.id}" id="del-${r.id}" style="margin-top:6px">${confirmKey==="dc-"+r.id?"Tap to confirm":"Delete"}</button>`:""}</div></div>`).join("");
}

function guideView(){
  return `<div class="panel guide">
    <section><h2>What is Mao?</h2>
      <p>Mao is a card game where <b>the rules are secret</b>. Players who know the rules won't explain them. New players learn by breaking them and getting a penalty card. Every time someone wins a hand, they secretly add a new rule. By the end of the night, the game is a glorious mess only your group understands.</p>
      <p>Underneath it all, it's just Crazy Eights: match the top card by suit or rank, and get rid of all your cards first.</p></section>

    <section><h3>What you need</h3>
      <ul><li>A standard 52-card deck for up to 5 players. Shuffle in a second deck for 6 or more.</li>
      <li>This app, as the rule-keeper and penalty tracker.</li>
      <li>A group willing to be confused and laugh about it.</li></ul></section>

    <section><h3>The deal</h3>
      <ol><li>Deal 7 cards to each player, face down.</li>
      <li>Put the rest in the middle as the draw pile and flip the top card face up to start the discard pile.</li>
      <li>The player to the dealer's left goes first. The game begins the moment the dealer says “The game of Mao begins.”</li></ol></section>

    <section><h3>A turn</h3>
      <ol><li>Play one card that matches the top card's <b>suit</b> or <b>rank</b>.</li>
      <li>If you can't (or don't want to), draw one card from the pile. Your turn is over.</li>
      <li>Follow any rule the card triggers: say the phrase, do the action, and so on.</li>
      <li>Play passes to the next player.</li></ol></section>

    <section><h3>Penalties</h3>
      <p>When someone breaks a rule, any player can hand them a penalty card from the draw pile and <b>name the offense, without explaining it</b>. For example: “Failure to say the name of the card.” That's all they get. The penalized player takes the card and (with the starter rules) says “Thank you.”</p>
      <p>In the app, tap <b>+1</b> next to their name and pick a reason. It keeps count for the stats${state.sips?", and since you're playing the drinking variant, every penalty card is also a sip":""}.</p>
      <div class="callout">Common penalties: talking, playing the wrong card, playing out of turn, taking too long, forgetting a phrase, forgetting to say “Mao,” and forgetting “Thank you.”</div></section>

    <section><h3>Point of order</h3>
      <p>Anyone can say <b>“Point of order”</b> to pause play. Everyone puts their cards face down, and talking is allowed: go to the bathroom, grab a drink, argue about a penalty. The game resumes when someone says “End point of order.” Touching your cards during a point of order is a penalty.</p></section>

    <section><h3>Winning a hand</h3>
      <ol><li>Say <b>“Mao”</b> when you're down to one card.</li>
      <li>Play your last card and say “Mao” again. You win the hand.</li>
      <li>You get to create a <b>new secret rule</b>. In the app, tap your name as the winner, take the phone, and pick from 3 options, or write your own.</li>
      <li>Announce only “There is a new rule.” Everyone else has to figure it out the hard way.</li></ol></section>

    <section><h3>The starting rules</h3>
      <p>These are the classic rules most groups start with. You can turn any of them off at setup.</p>
      <ul>${STARTERS.map(s=>`<li><b>${s[1]}:</b> ${s[2]}</li>`).join("")}</ul></section>

    <section><h3>House extras in this app</h3>
      <ul><li><b>Retire old rules.</b> When a new rule pushes the count past your max, the oldest secret rule gets revealed to everyone and dropped. Read it out loud.</li>
      <li><b>Guess the rule.</b> During a point of order, a player can guess one secret rule (not their own). The rule's maker peeks and judges. Right: the guesser discards a card and the rule becomes public, though it stays in effect. Wrong: the guesser takes a penalty card.</li>
      <li><b>Chairman titles.</b> Each hand's winner gets a grand title, like “Archduke of Aces.” Until the next hand, everyone must use it, or take a card.</li></ul>
      <p>Turn any of these on or off at setup or under House extras in the Game tab.</p></section>
    <section><h3>Explaining Mao to friends</h3>
      <p>Part of the fun is that you're not supposed to explain much. Here's a script you can read out loud before the first deal:</p>
      <div class="script">“This is Mao. I can only tell you three things. One: play a card that matches the suit or number of the top card, and try to get rid of all your cards. Two: if you break a rule, you'll get a penalty card, and someone will tell you what you did wrong, but not why. Three: you can say ‘Point of order’ to pause the game and ask a question. Other than that, you'll have to figure it out. The game of Mao begins.”</div></section>

    <section><h3>Tips for a great first game</h3>
      <ul><li><b>Use beginner mode.</b> For a group where nobody knows Mao, let everyone see the starting rules. Keep only the winners' rules secret. It's still plenty confusing.</li>
      <li><b>Name a penalty judge.</b> One person settles disputes during a point of order. The last hand's winner works well.</li>
      <li><b>Penalize with a smile.</b> The best Mao tables are playful, not strict. If someone looks lost, give them a few free turns.</li>
      <li><b>Make rules that can be noticed.</b> A good rule is triggered by something visible, like a card being played, so players can eventually work it out. “Say pickle when a 6 is played” is great. “Think about pickles” is not.</li>
      <li><b>One rule per win.</b> Keep a cap of about 6 to 8 secret rules, or retire the oldest. Beyond that, nobody can play.</li>
      <li><b>No rules about bodies or embarrassing stuff.</b> Keep it fun for everyone.</li>
      <li><b>Do the big reveal.</b> At the end of the night, tap “The big reveal” and read every secret rule out loud. It's the best part.</li></ul></section>

    <section><h3>Mao etiquette</h3>
      <ul><li>Never explain a rule. Just name the offense.</li>
      <li>Only penalize for rules you know. Calling fake penalties is itself a common house penalty.</li>
      <li>If a penalty is disputed, call a point of order and let the judge decide.</li>
      <li>Winners should enforce their own rule first, so others can start to spot the pattern.</li></ul></section>
  </div>`;
}

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null;
  switch(act){
    case "tab": state.tab = b.dataset.v; penFor = null; save(); render(); window.scrollTo(0,0); break;
    case "count": state.count = Math.min(12, Math.max(3, state.count + +b.dataset.d)); save(); render(); break;
    case "beginner": state.beginner = !state.beginner; save(); render(); break;
    case "sips": state.sips = !state.sips; save(); render(); break;
    case "starter": { const k = b.dataset.v; if (k !== "match"){ state.starter[k] = !state.starter[k]; save(); render(); } break; }
    case "start":
      state.players = Array.from({length:state.count},(_,k)=> (state.names[k]||"").trim() || `Player ${k+1}`);
      state.hands = []; state.penalties = []; state.rules = []; state.guesses = []; state.lastRetired = null; state.revealed = false; state.phase = "play"; save(); render(); keepAwake(); break;
    case "penOpen": penFor = penFor === i ? null : i; render(); break;
    case "pen": state.penalties.push({ p:i, r:+b.dataset.v, hand:handNo() }); penFor = null; save(); showToast(`${N(i)}: ${REASONS[+b.dataset.v]}. Take a card${state.sips?" and a sip":""}.`); render(); break;
    case "undoPen": confirmThen("undoPen", ()=>{ state.penalties.pop(); save(); render(); }); break;
    case "win": making = { winner:i, step:"pass", options:drawOptions(3), pick:null }; state.hands.push({ winner:i, rule:false, title: TITLES[Math.floor(Math.random()*TITLES.length)] }); state.lastRetired = null; save(); render(); window.scrollTo(0,0); break;
    case "iam": making.step = "choose"; render(); break;
    case "skipRule": making = null; render(); break;
    case "pickOpt": making.pick = +b.dataset.v; render(); break;
    case "shuffleOpts": making.options = drawOptions(3); making.pick = null; render(); break;
    case "writeOwn": {
      const t = document.getElementById("ownTitle").value.trim(), d = document.getElementById("ownDesc").value.trim();
      if (!t || !d){ making.error = "Give it a short name and say what has to happen."; render(); break; }
      making.options = [{ id:"own-"+Date.now().toString(36), c:"wild", t, d, own:true }]; making.pick = 0; making.error = ""; render(); break;
    }
    case "seal": {
      const r = making.options[making.pick];
      state.rules.push({ id:r.id, t:r.t, d:r.d, c:r.c, by:making.winner, hand:state.hands.length });
      state.hands[state.hands.length-1].rule = true;
      state.lastRetired = [];
      if (state.extras.retire){
        let act = activeRules();
        while (act.length > state.extras.cap){ const [old, k] = act[0]; old.retired = true; old.retiredAt = state.hands.length; state.lastRetired.push(k); act = activeRules(); }
      }
      making.step = "sealed"; save(); render(); break;
    }
    case "doneHand": making = null; render(); window.scrollTo(0,0); break;
    case "undoHand": confirmThen("undoHand", ()=>{ const hn = state.hands.length; const h = state.hands.pop(); if (h && h.rule) state.rules.pop();
      state.rules.forEach(r => { if (r.retired && r.retiredAt === hn){ r.retired = false; delete r.retiredAt; } }); state.lastRetired = null; save(); render(); }); break;
    case "dismissRetired": state.lastRetired = null; save(); render(); break;
    case "xRetire": state.extras.retire = !state.extras.retire; save(); render(); break;
    case "xCap": state.extras.cap = +b.dataset.v; save(); render(); break;
    case "xGuess": state.extras.guess = !state.extras.guess; save(); render(); break;
    case "xTitles": state.extras.titles = !state.extras.titles; save(); render(); break;
    case "guessStart": guess = { step:"who" }; render(); window.scrollTo(0,0); break;
    case "guessWho": guess.guesser = i; guess.step = "which"; render(); break;
    case "guessRule": guess.rule = +b.dataset.v; guess.step = "judge"; render(); break;
    case "guessCancel": guess = null; render(); break;
    case "guessRight": { const r = state.rules[guess.rule]; r.cracked = true; r.crackedBy = guess.guesser; state.guesses.push({ p:guess.guesser, rule:guess.rule, ok:true, hand:handNo() });
      showToast(`Cracked! ${N(guess.guesser)} discards a card. Rule ${guess.rule+1} is now public.`); guess = null; save(); render(); break; }
    case "guessWrong": state.guesses.push({ p:guess.guesser, rule:guess.rule, ok:false, hand:handNo() }); state.penalties.push({ p:guess.guesser, r:9, hand:handNo() });
      showToast(`Wrong! ${N(guess.guesser)} takes a penalty card${state.sips?" and a sip":""}.`); guess = null; save(); render(); break;
    case "reveal": if (state.revealed){ state.revealed = false; save(); render(); } else confirmThen("reveal", ()=>{ state.revealed = true; save(); render(); }); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.hands = []; state.penalties = []; state.rules = []; state.revealed = false; state.tab = "game"; save(); render(); }); break;
    case "fav": { const id = b.dataset.id; if (prefs.favs[id]) delete prefs.favs[id]; else prefs.favs[id] = true; savePrefs(); render(); break; }
    case "mode": prefs.mode = b.dataset.v; savePrefs(); render(); break;
    case "cat": prefs.cat = b.dataset.v; savePrefs(); render(); break;
    case "onlyFav": prefs.onlyFav = !prefs.onlyFav; savePrefs(); render(); break;
    case "addRule": {
      const t = document.getElementById("newTitle").value.trim(), d = document.getElementById("newDesc").value.trim(), c = document.getElementById("newCat").value;
      if (!t || !d){ prefs.addErr = "Give the rule a name and say what has to happen."; render(); break; }
      const id = "h-" + slug(t) + "-" + Date.now().toString(36);
      prefs.custom.push({ id, c, t, d }); prefs.favs[id] = true; prefs.addErr = ""; savePrefs(); render(); break;
    }
    case "delCustom": { const id = b.dataset.id; confirmThen("dc-"+id, ()=>{ prefs.custom = prefs.custom.filter(r=>r.id!==id); delete prefs.favs[id]; savePrefs(); render(); }); break; }
  }
});
// press and hold to peek
// Peeking flips the card open in place, with no redraw, so the phone never loses track of the finger
function setPeek(id, on){
  const card = document.querySelector(`[data-card="${id}"]`); if (!card) return;
  card.classList.toggle("open", on);
  card.querySelector(".reveal").hidden = !on;
  const ic = card.querySelector(".ic"); ic.textContent = on ? "📜" : ic.dataset.icon;
  const btn = card.querySelector(".peek"); if (btn) btn.textContent = on ? "Peeking" : "Hold to peek";
}
function peekStart(e){ const b = e.target.closest("[data-peek]"); if (!b) return; e.preventDefault(); if (openPeek) setPeek(openPeek, false); openPeek = b.dataset.peek; setPeek(openPeek, true); }
function peekEnd(){ if (openPeek){ setPeek(openPeek, false); openPeek = null; } }
document.addEventListener("pointerdown", peekStart);
document.addEventListener("pointerup", peekEnd);
document.addEventListener("pointerleave", peekEnd);
window.addEventListener("blur", peekEnd);
document.addEventListener("pointercancel", peekEnd);
document.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && e.target.dataset && e.target.dataset.peek){ e.preventDefault(); if (!openPeek){ openPeek = e.target.dataset.peek; setPeek(openPeek, true); } } });
document.addEventListener("keyup", e => { if ((e.key === " " || e.key === "Enter") && openPeek) peekEnd(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-peek]")) e.preventDefault(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.name != null){ state.names[+t.dataset.name] = t.value; save(); }
  if (t.id === "q"){ prefs.q = t.value; savePrefs(); const l = document.getElementById("rlist"); if (l) l.innerHTML = ruleList(); }
});

render();
keepAwake();
</script>
